<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI - Phishing URL Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 16px 20px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #3a7bd5;
        }

        .input-group input::placeholder {
            color: #666;
        }

        .btn {
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(58, 123, 213, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Styles */
        .result {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .result-badge {
            display: inline-block;
            padding: 12px 32px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            margin-bottom: 15px;
        }

        .badge-phishing {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);
        }

        .badge-legitimate {
            background: linear-gradient(90deg, #11998e, #38ef7d);
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }

        .badge-unreachable {
            background: linear-gradient(90deg, #f7971e, #ff6a00);
            box-shadow: 0 10px 30px rgba(247, 151, 30, 0.4);
        }

        .badge-unknown {
            background: linear-gradient(90deg, #485563, #29323c);
            box-shadow: 0 10px 30px rgba(72, 85, 99, 0.5);
        }

        .status-reason {
            color: #ccc;
            font-size: 0.95rem;
            max-width: 640px;
            margin: 0 auto 6px;
            line-height: 1.5;
        }

        .status-note {
            display: none;
            background: rgba(0, 0, 0, 0.35);
            border-left: 3px solid #f7971e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #ddd;
            text-align: left;
            margin-top: 14px;
            line-height: 1.5;
        }

        .confidence-bar {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            overflow: hidden;
            margin: 15px 0;
        }

        .confidence-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1s ease;
        }

        .confidence-phishing {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
        }

        .confidence-legitimate {
            background: linear-gradient(90deg, #11998e, #38ef7d);
        }

        .probabilities {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .prob-card {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .prob-card h4 {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .prob-card .value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .prob-phishing .value { color: #ff416c; }
        .prob-legit .value { color: #38ef7d; }

        /* Features Grid */
        .features-section {
            margin-top: 25px;
        }

        .features-section h3 {
            margin-bottom: 15px;
            color: #3a7bd5;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .feature-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feature-name {
            color: #aaa;
            font-size: 0.85rem;
        }

        .feature-value {
            color: #00d2ff;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Verification Pipeline */
        .verification-section {
            margin-top: 25px;
        }

        .verification-section h3 {
            margin-bottom: 15px;
            color: #3a7bd5;
        }

        .verify-steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .verify-step {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            background: rgba(0, 0, 0, 0.3);
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .step-icon {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .step-body {
            flex: 1;
        }

        .step-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 3px;
            color: #fff;
        }

        .step-detail {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.45;
        }

        .step-pass .step-title { color: #38ef7d; }
        .step-fail .step-title { color: #ff416c; }
        .step-warn .step-title { color: #f7971e; }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #3a7bd5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error */
        .error-msg {
            display: none;
            background: rgba(255, 65, 108, 0.2);
            border: 1px solid rgba(255, 65, 108, 0.5);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            color: #ff416c;
            margin-top: 20px;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 50px;
            color: #555;
            font-size: 0.9rem;
        }

        /* URL display */
        .url-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #00d2ff;
            word-break: break-all;
            margin-bottom: 20px;
            border-left: 3px solid #3a7bd5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ PhishGuard AI</h1>
            <p>AI-powered Phishing URL Detection with Explainable AI</p>
        </header>

        <!-- Search Box -->
        <div class="search-box">
            <div class="input-group">
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="Enter URL to check (e.g., https://example.com)"
                    autocomplete="off"
                >
                <button class="btn" id="checkBtn" onclick="checkURL()">
                    Check URL
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Running verification pipeline (URL → Domain → ML)...</p>
        </div>

        <!-- Error -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Result -->
        <div class="result" id="result">
            <div class="url-display" id="urlDisplay"></div>

            <div class="result-header">
                <div class="result-badge" id="resultBadge"></div>
                <p class="status-reason" id="statusReason"></p>
                <p id="confidenceText"></p>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
                <div class="status-note" id="statusNote"></div>
            </div>

            <!-- Verification Pipeline (4 steps) -->
            <div class="verification-section">
                <h3>🔍 Verification Pipeline</h3>
                <div class="verify-steps" id="verifySteps"></div>
            </div>

            <div class="probabilities" id="probCards">
                <div class="prob-card prob-phishing">
                    <h4>Phishing Probability</h4>
                    <div class="value" id="phishProb">0%</div>
                </div>
                <div class="prob-card prob-legit">
                    <h4>Legitimate Probability</h4>
                    <div class="value" id="legitProb">0%</div>
                </div>
            </div>

            <div class="features-section" id="featuresSection">
                <h3>📊 Extracted Features</h3>
                <div class="features-grid" id="featuresGrid"></div>
            </div>
        </div>

        <footer>
            <p>PhishGuard AI — Thesis Project | AI/XAI-based Phishing URL Detection</p>
        </footer>
    </div>

    <script>
        // Allow Enter key to trigger search
        document.getElementById("urlInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkURL();
        });

        async function checkURL() {
            const url = document.getElementById("urlInput").value.trim();
            const btn = document.getElementById("checkBtn");
            const loading = document.getElementById("loading");
            const result = document.getElementById("result");
            const errorMsg = document.getElementById("errorMsg");

            // Reset
            result.style.display = "none";
            errorMsg.style.display = "none";

            if (!url) {
                errorMsg.textContent = "Please enter a URL";
                errorMsg.style.display = "block";
                return;
            }

            // Show loading
            btn.disabled = true;
            btn.textContent = "Checking...";
            loading.style.display = "block";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (data.error) {
                    errorMsg.textContent = data.error;
                    errorMsg.style.display = "block";
                } else {
                    displayResult(data);
                }

            } catch (err) {
                errorMsg.textContent = "Error: " + err.message;
                errorMsg.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Check URL";
                loading.style.display = "none";
            }
        }

        function displayResult(data) {
            const result = document.getElementById("result");
            const badge = document.getElementById("resultBadge");
            const statusReason = document.getElementById("statusReason");
            const statusNote = document.getElementById("statusNote");
            const confText = document.getElementById("confidenceText");
            const confFill = document.getElementById("confidenceFill");
            const urlDisplay = document.getElementById("urlDisplay");
            const probCards = document.getElementById("probCards");
            const phishProb = document.getElementById("phishProb");
            const legitProb = document.getElementById("legitProb");
            const verifySteps = document.getElementById("verifySteps");
            const featuresSection = document.getElementById("featuresSection");
            const featuresGrid = document.getElementById("featuresGrid");

            // URL
            urlDisplay.textContent = data.url;

            // ---- Final Assessment badge (4 statuses) ----
            const statusStyles = {
                Phishing:     { text: "🚨 PHISHING DETECTED",        cls: "result-badge badge-phishing" },
                Legitimate:   { text: "✅ LEGITIMATE URL",           cls: "result-badge badge-legitimate" },
                Unreachable:  { text: "⚠️ UNREACHABLE — CANNOT VERIFY", cls: "result-badge badge-unreachable" },
                Unknown:      { text: "❓ UNKNOWN — INSUFFICIENT INFO", cls: "result-badge badge-unknown" }
            };
            const style = statusStyles[data.status] || statusStyles.Unknown;
            badge.textContent = style.text;
            badge.className = style.cls;

            // ---- Status reason ----
            statusReason.textContent = data.status_reason || "";

            // ---- Explanatory notes for non-binary statuses ----
            const notes = {
                Unreachable: "⚠️ Unreachable does NOT mean safe, and it does NOT mean phishing. Phishing websites frequently go offline, let their domains expire, or stay temporarily unavailable.",
                Unknown: "ℹ️ Not enough reliable information was available to classify this URL."
            };
            if (notes[data.status]) {
                statusNote.textContent = notes[data.status];
                statusNote.style.display = "block";
            } else {
                statusNote.style.display = "none";
            }

            // ---- Confidence + model probabilities ----
            const hasModel = data.prediction !== null && data.prediction !== undefined
                          && data.confidence !== null && data.confidence !== undefined;
            if (hasModel) {
                confText.textContent = `Model confidence: ${data.confidence}%`;
                confFill.style.width = data.confidence + "%";
                confFill.className = "confidence-fill " +
                    (data.prediction === "Phishing" ? "confidence-phishing" : "confidence-legitimate");
                phishProb.textContent = data.phishing_probability + "%";
                legitProb.textContent = data.legitimate_probability + "%";
                probCards.style.display = "flex";
            } else {
                confText.textContent = "Model confidence: unavailable";
                confFill.style.width = "0%";
                probCards.style.display = "none";
            }

            // ---- Verification Pipeline (4 steps) ----
            verifySteps.innerHTML = "";
            const v = data.verification || {};
            const steps = [];

            // Step 1: URL Validation
            steps.push({
                icon: v.url_valid ? "✅" : "❌",
                cls: v.url_valid ? "step-pass" : "step-fail",
                title: "1. URL Validation (Format & Scheme)",
                detail: v.url_detail || (v.url_valid ? "Valid URL" : "Invalid URL")
            });

            // Step 2: Domain Verification (DNS + HTTP)
            let domainIcon, domainCls, domainDetail;
            if (v.dns_resolved === null || v.dns_resolved === undefined) {
                domainIcon = "⏭️";
                domainCls = "";
                domainDetail = "Skipped — URL validation failed";
            } else if (!v.dns_resolved) {
                domainIcon = "❌";
                domainCls = "step-fail";
                domainDetail = v.domain_detail || "DNS resolution failed";
            } else if (!v.reachable) {
                domainIcon = "❌";
                domainCls = "step-fail";
                domainDetail = "DNS resolved, but connection failed — " + (v.domain_detail || "");
            } else {
                domainIcon = "✅";
                domainCls = "step-pass";
                domainDetail = "DNS resolved — " + (v.domain_detail || "reachable");
            }
            steps.push({
                icon: domainIcon,
                cls: domainCls,
                title: "2. Domain Verification (DNS + HTTP Probe)",
                detail: domainDetail
            });

            // Step 3: ML Prediction
            if (hasModel) {
                steps.push({
                    icon: data.prediction === "Phishing" ? "🚨" : "✅",
                    cls: data.prediction === "Phishing" ? "step-fail" : "step-pass",
                    title: "3. Machine Learning Prediction (Random Forest)",
                    detail: `Model verdict: ${data.prediction} (confidence ${data.confidence}%)`
                });
            } else {
                steps.push({
                    icon: "⏭️",
                    cls: "",
                    title: "3. Machine Learning Prediction (Random Forest)",
                    detail: "Not run — insufficient information"
                });
            }

            // Step 4: Final Assessment
            const finalIcons = { Phishing: "🚨", Legitimate: "✅", Unreachable: "⚠️", Unknown: "❓" };
            const finalCls = {
                Phishing: "step-fail",
                Legitimate: "step-pass",
                Unreachable: "step-warn",
                Unknown: "step-warn"
            };
            steps.push({
                icon: finalIcons[data.status] || "❓",
                cls: finalCls[data.status] || "step-warn",
                title: "4. Final Assessment",
                detail: `${data.status} — ${data.status_reason || ""}`
            });

            for (const s of steps) {
                const div = document.createElement("div");
                div.className = "verify-step " + s.cls;

                const icon = document.createElement("span");
                icon.className = "step-icon";
                icon.textContent = s.icon;

                const body = document.createElement("div");
                body.className = "step-body";

                const title = document.createElement("div");
                title.className = "step-title";
                title.textContent = s.title;

                const detail = document.createElement("div");
                detail.className = "step-detail";
                detail.textContent = s.detail;

                body.appendChild(title);
                body.appendChild(detail);
                div.appendChild(icon);
                div.appendChild(body);
                verifySteps.appendChild(div);
            }

            // ---- Features ----
            featuresGrid.innerHTML = "";
            if (data.features) {
                const featureLabels = {
                    url_length: "URL Length",
                    path_length: "Path Length",
                    dot_count: "Dot Count",
                    subdomain_count: "Subdomains",
                    tld_length: "TLD Length",
                    has_ip_address: "IP Address",
                    has_hyphen_in_domain: "Hyphen",
                    https_flag: "HTTPS",
                    percentage_numeric_chars: "Numeric %",
                    number_of_digits: "Digits",
                    token_count: "Tokens",
                    url_entropy: "Entropy",
                    domain_name_length: "Domain Len",
                    suspicious_file_extension: "Suspicious Ext",
                    tld_popularity: "Popular TLD",
                    query_param_count: "Query Params"
                };

                for (const [key, value] of Object.entries(data.features)) {
                    const item = document.createElement("div");
                    item.className = "feature-item";

                    const name = document.createElement("span");
                    name.className = "feature-name";
                    name.textContent = featureLabels[key] || key;

                    const val = document.createElement("span");
                    val.className = "feature-value";
                    val.textContent = value;

                    item.appendChild(name);
                    item.appendChild(val);
                    featuresGrid.appendChild(item);
                }
                featuresSection.style.display = "block";
            } else {
                featuresSection.style.display = "none";
            }

            // Show result
            result.style.display = "block";
        }
    </script>
</body>
</html>
